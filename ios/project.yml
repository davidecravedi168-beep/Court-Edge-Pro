name: CourtEdge
options:
  bundleIdPrefix: it.courtedge
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CourtEdge:
    type: application
    platform: iOS
    sources:
      - path: CourtEdge
        excludes:
          - PrivacyInfo.xcprivacy
    resources:
      - path: CourtEdge/PrivacyInfo.xcprivacy
    info:
      path: CourtEdge/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.courtedge.pro
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
