name: Court Edge Euro History Fix

on:
  push:
    branches: [court-edge-euro-history-fix]
    paths:
      - 'scripts/fix-euro-history.mjs'
      - '.github/workflows/euro-history-fix.yml'

permissions:
  contents: write

jobs:
  fix-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply fix
        run: node scripts/fix-euro-history.mjs
      - name: Build real boards
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: eu
          ODDS_MARKETS: h2h,spreads,totals
          BDL_MIN_INTERVAL_MS: '13000'
          COMMERCIAL_MODE: 'false'
        run: node scripts/run-v4-budgeted.mjs
      - name: Full tests
        run: npm test
      - name: Stress gate
        run: node tests/court-edge-v4-stress.mjs
      - name: Euro sanity gate
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('data/euroleague-v4-board.json','utf8'));
          const now=Date.now();
          for(const x of b.radar){
            if(x.forecast_state==='THIN' && (x.projected_winner!=null || x.projected_winner_prob!=null)) throw new Error('THIN forecast emitted a winner');
            const h=x.team_stats?.home,a=x.team_stats?.away;
            for(const t of [h,a]) if(t?.last_game && Date.parse(t.last_game)>now) throw new Error(`future historical game leaked: ${t.last_game}`);
            for(const t of [h,a]) if(t?.games>=20 && ((t.avg_pf||0)<40 || (t.avg_pa||0)<40)) throw new Error(`implausible EuroLeague scoring stats: ${JSON.stringify(t)}`);
          }
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes('DATI INSUFFICIENTI')) throw new Error('thin forecast UX missing');
          console.log(JSON.stringify({radar:b.radar.length,model_stats:b.model_stats,first:b.radar[0]||null},null,2));
          NODE
      - name: Commit validated fix
        run: |
          git config user.name 'court-edge-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add court-edge-v4.mjs index.html data/nba-v4-board.json data/euroleague-v4-board.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'fix: exclude future EuroLeague games and gate thin forecasts'
            git push
          fi
