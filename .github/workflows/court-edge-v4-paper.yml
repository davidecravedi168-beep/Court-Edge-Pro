name: Court Edge Pro 4 Paper Lab
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: court-edge-v4-paper
  cancel-in-progress: false
jobs:
  v4-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: V4 syntax + stress contract
        run: |
          node --check v4/core.mjs
          node --check v4/market.mjs
          node --check v4/providers.mjs
          node --check v4/run.mjs
          node --check v4/app.js
          node tests/v4.test.mjs
      - name: Run V4 paper engine
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_REGIONS: eu
          COMMERCIAL_MODE: 'false'
        run: node v4/run.mjs
      - name: Validate board contracts
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['data/nba-v4-board.json','data/euroleague-v4-board.json']){
            const x=JSON.parse(fs.readFileSync(f,'utf8'));
            if(x?.meta?.version!=='COURT-EDGE-4.0-BETTING-TERMINAL') throw new Error(`${f}: version`);
            for(const m of x.markets||[]){
              if(m.market_key!=='h2h'&&m.validation_state==='TEST'&&m.decision==='PAPER BET') throw new Error(`${f}: TEST promoted`);
              if(m.decision!=='WAIT'&&!(m.best_odds>1&&m.price_to_bet>1)) throw new Error(`${f}: price guard`);
            }
          }
          console.log('V4 board contracts PASS');
          NODE
      - name: Commit paper state
        run: |
          git config user.name "court-edge-v4-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba-v4-board.json data/euroleague-v4-board.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "v4: refresh multi-market paper boards"
          git push
