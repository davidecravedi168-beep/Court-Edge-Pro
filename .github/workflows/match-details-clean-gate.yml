name: Court Edge Match Details Clean Gate

on:
  push:
    branches: [court-edge-match-details]
    paths:
      - '.github/workflows/match-details-clean-gate.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reset index to current main and install clean drawer
        run: |
          git fetch origin main
          git show origin/main:index.html > index.html
          node scripts/install-match-details.mjs
      - name: Tests
        run: npm test
      - name: Static UX contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const js=fs.readFileSync('match-details.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          if(!html.includes('match-details.js?v=4.2')) throw new Error('script not installed');
          for(const t of ['MATCH INTELLIGENCE','PUNTI FATTI / G','PUNTI SUBITI / G','HOME MARGIN','AFFIDABILITÀ','BET ≥']) if(!js.includes(t)) throw new Error('missing '+t);
          if(!sw.includes("'./match-details.js'")) throw new Error('PWA cache missing details');
          console.log('clean interactive dossier PASS');
          NODE
      - name: Commit consolidated implementation
        run: |
          git config user.name 'court-edge-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js match-details.js tests/match-details.test.mjs
          git commit -m 'feat: open full match intelligence when cards are tapped' || true
          git push
