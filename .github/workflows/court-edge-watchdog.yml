name: Court Edge V4 Autopilot Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: court-edge-v4-watchdog
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V4 board freshness and recover
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if node - <<'NODE'
          const fs=require('fs');
          const files=['data/nba-v4-board.json','data/euroleague-v4-board.json'];
          const ages=files.map(f=>{
            const j=JSON.parse(fs.readFileSync(f,'utf8'));
            if(j.integrity?.strict_no_fabrication!==true) return Infinity;
            return (Date.now()-Date.parse(j.meta?.updated_at||''))/3600000;
          });
          if(ages.some(x=>!Number.isFinite(x)||x>4.25))process.exit(1);
          console.log('Court Edge V4 boards fresh:',ages.map(x=>x.toFixed(2)+'h').join(', '));
          NODE
          then
            exit 0
          fi
          gh workflow run court-edge-autopilot.yml -f recovery=true
