name: Court Edge Match Details V4.3 Gate

on:
  push:
    branches: [court-edge-match-details-v43]
    paths:
      - 'match-details-v43.js'
      - 'scripts/install-match-details-v43.mjs'
      - '.github/workflows/match-details-v43-gate.yml'

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install explicit match-card opener
        run: node scripts/install-match-details-v43.mjs
      - name: JavaScript syntax
        run: node --check match-details-v43.js
      - name: Full regression suite
        run: npm test
      - name: Tap/open static contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const j=fs.readFileSync('match-details-v43.js','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          for(const t of ['data-ce-kind="forecast"','data-ce-kind="bet"','CourtEdgeDetails?.openById','match-details-v43.js?v=4.3']) if(!h.includes(t)) throw new Error('index missing '+t);
          for(const t of ['window.CourtEdgeDetails={ready:true,openById,close,decorate}','MATCH INTELLIGENCE','PUNTI FATTI / G','PUNTI SUBITI / G','TOTAL PROIETTATO','BET ≥']) if(!j.includes(t)) throw new Error('details missing '+t);
          if(!sw.includes("court-edge-pro-v4-3-0")||!sw.includes("'./match-details-v43.js'")) throw new Error('service worker cache not bumped');
          if(/Math\.random\(/.test(j)) throw new Error('details must not fabricate stats');
          console.log('V4.3 tap/open contract PASS');
          NODE
      - name: Commit validated V4.3 wiring
        run: |
          git config user.name 'court-edge-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then echo 'No wiring changes'; else git commit -m 'fix: make match cards open statistics on direct tap'; git push; fi
