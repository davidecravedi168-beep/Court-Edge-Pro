name: Court App Branding V6
on:
  push:
    branches: [main]
    paths:
      - 'scripts/app_branding_v6.py'
      - '.github/workflows/app-branding-v6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/app_branding_v6.py
      - name: Validate branding
        run: |
          test -s assets/icon-192.png
          test -s assets/icon-512.png
          grep -q 'apple-touch-icon' index.html
          grep -q 'manifest.webmanifest' index.html
          git diff --check
      - name: Persist branding wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: install Court home-screen identity'
          git pull --rebase origin main
          git push origin HEAD:main
