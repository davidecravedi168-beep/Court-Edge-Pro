name: Court Quant UI V5

on:
  push:
    branches: [main]
    paths:
      - "quant-math-v5.js"
      - "quant-desk-v5.js"
      - "tests/quant-math-v5.test.cjs"
      - "scripts/upgrade_quant_ui_v5.py"
      - ".github/workflows/court-quant-ui-v5.yml"
  pull_request:
    branches: [main]
    paths:
      - "quant-math-v5.js"
      - "quant-desk-v5.js"
      - "tests/quant-math-v5.test.cjs"
      - "scripts/upgrade_quant_ui_v5.py"
      - ".github/workflows/court-quant-ui-v5.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-quant-ui-v5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply idempotent UI migration
        run: python scripts/upgrade_quant_ui_v5.py
      - name: Quant formula regression tests
        run: node tests/quant-math-v5.test.cjs
      - name: Syntax and contract checks
        run: |
          node --check quant-math-v5.js
          node --check quant-desk-v5.js
          grep -q 'quant-math-v5.js?v=5.0' index.html
          grep -q 'quant-desk-v5.js?v=5.0' index.html
          grep -q 'QUANT RIBBON' quant-desk-v5.js
          grep -q 'Fractional Kelly' quant-desk-v5.js
          git diff --check
      - name: Publish tested script wiring
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet; then
            echo 'No UI wiring changes to publish'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Court Edge Pro V5 — wire premium quant UI'
          git push origin HEAD:main
