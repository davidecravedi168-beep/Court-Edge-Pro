name: Premium Brand Assets
on:
  push:
    branches: [main]
    paths: ['assets/brand-premium.svg','.github/workflows/premium-brand-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check cairosvg
      - name: Render iOS and Android assets
        run: |
          python - <<'PY'
          import cairosvg
          for size,name in [(180,'assets/icon-180.png'),(192,'assets/icon-192.png'),(512,'assets/icon-512.png')]:
              cairosvg.svg2png(url='assets/brand-premium.svg',write_to=name,output_width=size,output_height=size)
          PY
      - run: file assets/icon-*.png && test -s assets/icon-512.png
      - name: Commit rendered assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/icon-180.png assets/icon-192.png assets/icon-512.png
          git diff --cached --quiet || (git commit -m 'feat: apply premium Court identity' && git push)
