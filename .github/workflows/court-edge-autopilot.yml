name: Court Edge Pro V7 Autopilot

on:
  workflow_dispatch:
    inputs:
      recovery:
        description: 'Watchdog recovery run'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 */6 * * *'
    - cron: '43 20 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: court-edge-v7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build validated boards
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: eu
          ODDS_MARKETS: ${{ github.event.schedule == '43 20 * * *' && 'h2h,spreads,totals' || (inputs.recovery && 'h2h' || 'h2h,spreads,totals') }}
          BDL_MIN_INTERVAL_MS: '13000'
          BDL_FREE_ONLY: 'true'
          COMMERCIAL_MODE: 'false'
        run: node scripts/run-v4-budgeted.mjs

      - name: Enrich NBA matchup intelligence and official live
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: node scripts/enrich-court-intel.mjs

      - name: Enrich verified NBA player form
        run: node scripts/enrich-nba-player-form.mjs

      - name: Enrich EuroLeague matchup intelligence
        run: node scripts/enrich-euro-intel.mjs

      - name: Test suite pass 1
        run: npm test

      - name: Test suite pass 2
        run: npm test

      - name: Randomized stress gate
        run: node tests/court-edge-v4-stress.mjs

      - name: Syntax verification
        run: |
          node --check edge-core.mjs
          node --check quant-engine.mjs
          node --check lock-engine.mjs
          node --check live-board.mjs
          node --check court-edge-v4.mjs
          node --check court-prediction-core.mjs
          node --check betting-ux.js
          node --check match-details-v43.js
          node --check quant-math-v5.js
          node --check quant-desk-v5.js
          node --check court-quality-governance-v6.js
          node --check court-intel.js
          node --check court-simple-ui.js
          node --check scripts/run-v4-budgeted.mjs
          node --check scripts/enrich-court-intel.mjs
          node --check scripts/enrich-nba-player-form.mjs
          node --check scripts/enrich-euro-intel.mjs
          node --check scripts/write-automation-health.mjs
          node --check tests/court-intel-static.mjs
          node --check sw.js

      - name: Deterministic contract
        run: node tests/static-v4-check.mjs

      - name: Court Intel contract
        run: node tests/court-intel-static.mjs

      - name: Write automation receipt
        env:
          COURT_BOARD_PROFILE: V7-TRUST-GOVERNED
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ODDS_MARKETS: ${{ github.event.schedule == '43 20 * * *' && 'h2h,spreads,totals' || 'h2h' }}
        run: node scripts/write-automation-health.mjs

      - name: Validate public boards
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['data/nba-v4-board.json','data/euroleague-v4-board.json']){
            const j=JSON.parse(fs.readFileSync(f,'utf8'));
            if(!j.meta||!j.integrity||!Array.isArray(j.markets)||!Array.isArray(j.best_bets)||!Array.isArray(j.radar)||!Array.isArray(j.history)) throw new Error(`Invalid board contract: ${f}`);
            if(j.integrity.strict_no_fabrication!==true) throw new Error(`Fail-closed flag missing: ${f}`);
            if(j.meta.prediction_version && (!Array.isArray(j.forecast_history)||!Array.isArray(j.forecast_locks)||!j.forecast_stats||!j.model_health)) throw new Error(`Prediction contract incomplete: ${f}`);
            if(j.meta.intelligence_version){
              if(j.meta.intelligence_version!=='COURT-INTEL-1.0') throw new Error('Unexpected Court Intel version');
              if(j.integrity.player_stats_no_fabrication!==true) throw new Error('Player-stat no-fabrication flag missing');
              for(const r of j.radar){if(!r.intelligence?.home||!r.intelligence?.away||!r.intelligence?.h2h||!r.intelligence?.matchup_radar)throw new Error(`Incomplete Court Intel matchup ${r.event_id}`)}
            }
          }
          const nba=JSON.parse(fs.readFileSync('data/nba-v4-board.json','utf8'));
          if(nba.meta.player_form_health==='ROLLING_OFFICIAL_BOXSCORES' && !(nba.meta.player_form_players>0)) throw new Error('Player form claims ready without verified players');
          console.log('Public board contract PASS');
          NODE

      - name: Persist refreshed boards and intelligence
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "court-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nba-v4-board.json data/euroleague-v4-board.json data/automation-health.json data/nba-intel-cache.json data/nba-player-form.json data/euroleague-intel-cache.json
          if git diff --cached --quiet; then
            echo "No verified data/intelligence changes to persist"
          else
            git commit -m "chore: persist Court intelligence snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build production site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          rm -rf _site
          mkdir -p _site/assets _site/data
          cp index.html betting-ux.js match-details-v43.js quant-math-v5.js quant-desk-v5.js court-quality-governance-v6.js court-intel.js court-simple-ui.js legal.html manifest.webmanifest sw.js robots.txt _site/
          cp assets/icon-192.png assets/icon-512.png _site/assets/
          cp data/nba-v4-board.json data/euroleague-v4-board.json data/automation-health.json _site/data/
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          intel='<script src="court-intel.js"></script>'
          simple='<script src="court-simple-ui.js"></script>'
          if intel not in s:
              if '</body>' not in s:
                  raise SystemExit('index closing body missing')
              s=s.replace('</body>',intel+'\n</body>')
          if simple not in s:
              s=s.replace('</body>',simple+'\n</body>')
          p.write_text(s,encoding='utf-8')
          built=p.read_text(encoding='utf-8')
          if intel not in built or simple not in built:
              raise SystemExit('Court UI injection failed')
          if built.index(simple) < built.index(intel):
              raise SystemExit('Simple UI must load after Court Intel')
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', built):
              if '://' in src:
                  continue
              target=Path('_site')/src.split('?')[0].lstrip('./')
              if not target.exists():
                  raise SystemExit(f'Missing runtime dependency in Pages artifact: {src}')
          print('Production runtime dependency contract PASS')
          PY

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: '_site'

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
