name: Court Edge Pro Autopilot

on:
  workflow_dispatch:
    inputs:
      recovery:
        description: 'Watchdog recovery run'
        required: false
        default: false
        type: boolean
  schedule:
    # Four low-cost Moneyline snapshots per day.
    - cron: '17 */6 * * *'
    # One daily multi-market research snapshot. Total budget: <=420 market units/month.
    - cron: '43 20 * * *'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: court-edge-pages
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build live boards
        if: github.event_name != 'push'
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: eu
          ODDS_MARKETS: ${{ github.event.schedule == '43 20 * * *' && 'h2h,spreads,totals' || 'h2h' }}
          BDL_MIN_INTERVAL_MS: '13000'
        run: node live-board.mjs

      - name: Test suite pass 1
        run: npm test

      - name: Test suite pass 2
        run: npm test

      - name: Syntax verification
        run: |
          node --check edge-core.mjs
          node --check quant-engine.mjs
          node --check lock-engine.mjs
          node --check live-board.mjs
          node --check scripts/write-automation-health.mjs
          node --check sw.js

      - name: Static verification
        run: node tests/static-check.mjs

      - name: Write signed automation receipt
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ODDS_MARKETS: ${{ github.event.schedule == '43 20 * * *' && 'h2h,spreads,totals' || 'h2h' }}
        run: node scripts/write-automation-health.mjs

      - name: Save refreshed boards
        if: github.event_name != 'push'
        run: |
          git config user.name "court-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No board changes to persist"
          else
            git commit -m "chore: refresh live boards"
            git push
          fi

      - name: Build production site
        run: |
          rm -rf _site
          mkdir -p _site/assets _site/data
          cp index.html legal.html manifest.webmanifest sw.js robots.txt _site/
          cp assets/icon-192.png assets/icon-512.png _site/assets/
          cp data/nba-quant-board.json data/euroleague-quant-board.json data/automation-health.json _site/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
