name: Court Edge V4 RC Real-Data Smoke

on:
  push:
    branches: [court-edge-4-clean-rc]
  workflow_dispatch:

permissions:
  contents: read

env:
  BDL_MIN_INTERVAL_MS: '13000'

jobs:
  real-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real V4 board without publishing
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: eu
          ODDS_MARKETS: h2h,spreads,totals
          COMMERCIAL_MODE: 'false'
        run: node scripts/run-v4-budgeted.mjs
      - name: Run full tests
        run: npm test
      - name: Run V4 stress gate
        run: node tests/court-edge-v4-stress.mjs
      - name: Validate generated boards
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['data/nba-v4-board.json','data/euroleague-v4-board.json']){
            const b=JSON.parse(fs.readFileSync(f,'utf8'));
            if(b.integrity?.strict_no_fabrication!==true) throw new Error(`${f}: strict_no_fabrication missing`);
            if(!Array.isArray(b.markets)||!Array.isArray(b.best_bets)||!Array.isArray(b.radar)||!Array.isArray(b.history)) throw new Error(`${f}: malformed board`);
            const invalid=b.markets.filter(x=>!(x.best_odds>1)||!(x.price_to_bet>1)||!(x.robust_prob>0&&x.robust_prob<1));
            if(invalid.length) throw new Error(`${f}: ${invalid.length} invalid market rows`);
            const badTest=b.best_bets.filter(x=>x.validation_state==='TEST' && (x.locked_stake_units||x.stake_units||0)>0);
            if(badTest.length) throw new Error(`${f}: TEST market received stake`);
            console.log(JSON.stringify({file:f,updated_at:b.meta?.updated_at,radar:b.radar.length,markets:b.markets.length,best_bets:b.best_bets.length,live:b.live?.length||0,closed:b.stats?.closed||0,data_health:b.meta?.data_health,market_health:b.meta?.market_health,injury_health:b.meta?.injury_health}));
          }
          NODE
      - name: Upload smoke boards
        uses: actions/upload-artifact@v4
        with:
          name: court-edge-v4-rc-real-data
          path: |
            data/nba-v4-board.json
            data/euroleague-v4-board.json
          retention-days: 3
