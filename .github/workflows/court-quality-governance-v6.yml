name: Court Quality Governance V6
on:
  push:
    branches: [main]
    paths:
      - 'court-quality-governance-v6.js'
      - 'scripts/upgrade_quality_governance_v6.py'
      - '.github/workflows/court-quality-governance-v6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/upgrade_quality_governance_v6.py
      - run: node --check court-quality-governance-v6.js
      - run: |
          grep -q 'court-quality-governance-v6.js?v=6.0' index.html
          grep -q 'Quality & Validation Governance' court-quality-governance-v6.js
          git diff --check
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Court Edge Pro V6 — wire quality governance'
          git push origin HEAD:main
